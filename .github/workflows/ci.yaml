name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.Sharefin.slnx -c Release

      - name: Test
        run: dotnet test --solution Jellyfin.Plugin.Sharefin.slnx -c Release --no-build

      - uses: actions/upload-artifact@v7
        with:
          name: Jellyfin.Plugin.Sharefin
          path: Jellyfin.Plugin.Sharefin/bin/Release/net10.0/Jellyfin.Plugin.Sharefin.dll
          retention-days: 14
