<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0e">
<title>Partage</title>
<style>
  /* Tokens follow the variables of the Jellyfin custom CSS theme (ElegantFin naming) when it defines them. */
  @layer base, theme; /* the Jellyfin theme sits in "theme": its variables and font apply, its rules never beat this page's */
  @layer base { :root { font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; } }
  :root { color-scheme:dark;
    --bg:var(--darkerGradientPoint, #0a0a0e); --panel:var(--headerColor, rgba(22,22,29,.78)); --overlay:var(--drawerColor, rgba(24,24,32,.94));
    --thumb:var(--cardBackgroundGradient, linear-gradient(135deg, #1c2533, #15151c)); --raise:rgba(255,255,255,.08); --line:var(--lighterBorderColor, rgba(255,255,255,.12));
    --text:var(--textColor, #f3f3f6); --muted:var(--dimTextColor, #a6a6b4); --accent:var(--accentColor, #00a4dc); --accent-hi:var(--accentHoverColor, #33b9ea);
    --error:#ff7676; --radius:var(--largeRadius, 12px); }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  body.noscroll { overflow:hidden; }
  [hidden] { display:none !important; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  svg { width:24px; height:24px; fill:currentColor; display:block; flex:none; }
  [data-icon] { display:inline-grid; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .muted { color:var(--muted); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .btn { display:inline-flex; align-items:center; gap:.55em; white-space:nowrap; border:0; border-radius:999px; padding:.75em 1.6em; font-weight:600; background:var(--raise); color:var(--text); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:background .15s, transform .15s; }
  .btn:hover { background:rgba(255,255,255,.16); }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn.primary { background:var(--accent); color:#fff; box-shadow:0 8px 28px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn.primary:hover { background:var(--accent-hi); }
  .btn svg { width:22px; height:22px; }
  .spinner { width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .meter { display:block; height:4px; border-radius:2px; background:rgba(255,255,255,.25); overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--accent); }

  /* Loading and errors */
  .status { min-height:100vh; display:grid; place-content:center; justify-items:center; gap:18px; padding:24px 16px; text-align:center; color:var(--muted); }
  .status p { margin:0; max-width:36ch; }

  /* Password */
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), radial-gradient(50% 50% at 90% 95%, color-mix(in srgb, var(--accent-hi) 20%, transparent), transparent 70%); }
  .login-card { width:100%; max-width:380px; padding:32px 28px; border-radius:var(--largerRadius, 20px); background:var(--panel); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:0 30px 80px rgba(0,0,0,.5); text-align:center; animation:rise .4s ease both; }
  .lock { width:58px; height:58px; margin:0 auto 16px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); }
  .login-card h1 { font-size:1.45rem; margin:0 0 .3rem; }
  .login-card > p { margin:0 0 1.4rem; }
  .field { position:relative; text-align:left; }
  .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.35rem; }
  .field input { width:100%; padding:.8em 3em .8em 1em; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.35); outline:none; transition:border-color .15s, box-shadow .15s; }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .reveal { position:absolute; right:6px; bottom:5px; width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:8px; background:transparent; color:var(--muted); }
  .reveal:hover { color:var(--text); }
  .reveal svg { width:20px; height:20px; }
  .error { color:var(--error); min-height:1.5em; margin:.7rem 0; font-size:.9rem; }
  .login-card .btn { width:100%; justify-content:center; }

  /* Details page */
  #app { position:relative; animation:rise .5s ease both; }
  .backdrop { position:absolute; inset:0 0 auto; height:min(90vh, 920px); overflow:hidden; background:radial-gradient(70% 60% at 75% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
  .backdrop img { width:100%; height:100%; object-fit:cover; object-position:center 20%; opacity:0; transition:opacity .8s; }
  .backdrop img.loaded { opacity:1; }
  .backdrop img.blur { filter:blur(48px) saturate(1.4); transform:scale(1.25); }
  .backdrop img.blur.loaded { opacity:.55; }
  .backdrop::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, color-mix(in srgb, var(--bg) 94%, transparent) 0%, color-mix(in srgb, var(--bg) 60%, transparent) 45%, color-mix(in srgb, var(--bg) 10%, transparent) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 55%); }
  .sf-page { position:relative; max-width:1440px; margin:0 auto; padding:0 clamp(16px, 4vw, 56px) 72px; }
  .hero { min-height:min(80vh, 780px); display:flex; align-items:flex-end; gap:44px; padding:96px 0 44px; }
  .poster { width:clamp(180px, 18vw, 260px); aspect-ratio:2/3; object-fit:cover; border-radius:var(--radius); box-shadow:0 24px 60px rgba(0,0,0,.6); flex:none; background:var(--thumb); }
  .info { flex:1; max-width:780px; min-width:0; }
  .eyebrow { text-transform:uppercase; letter-spacing:.12em; font-size:.8rem; font-weight:700; color:var(--accent-hi); margin:0 0 .5rem; }
  .logo { display:block; max-width:min(460px, 85%); max-height:160px; object-fit:contain; object-position:left bottom; margin-bottom:1.1rem; filter:drop-shadow(0 4px 24px rgba(0,0,0,.6)); }
  .hero h1 { font-size:clamp(2rem, 4.6vw, 3.7rem); line-height:1.05; letter-spacing:-.02em; font-weight:800; margin:0 0 .8rem; text-shadow:0 2px 24px rgba(0,0,0,.5); }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem 1.1rem; color:var(--text); margin-bottom:1rem; }
  .badge { border:1px solid rgba(255,255,255,.45); border-radius:4px; padding:0 .45em; font-size:.8rem; font-weight:700; }
  .star { display:inline-flex; align-items:center; gap:.3em; }
  .star svg { width:17px; height:17px; color:#f5c518; }
  .tagline { font-style:italic; font-size:1.05rem; color:var(--text); margin:0 0 .5rem; }
  .overview { color:var(--text); max-width:68ch; margin:0 0 1.6rem; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; }
  .resume { display:flex; align-items:center; gap:12px; max-width:380px; margin-top:16px; color:var(--muted); font-size:.9rem; }
  .resume .meter { flex:1; }
  .party { max-width:560px; margin-top:18px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .party p { margin:0 0 10px; }
  .party-row { display:flex; flex-wrap:wrap; gap:8px; }
  .party-row input { flex:1; min-width:0; padding:.6em .9em; border:1px solid var(--line); border-radius:999px; background:rgba(0,0,0,.35); }
  .party-row .btn { padding:.6em 1.1em; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.14); font-size:.9rem; font-variant-numeric:tabular-nums; }
  .pill svg { width:18px; height:18px; }

  /* Episodes */
  .episodes-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; margin:8px 0 22px; }
  .episodes-head h2 { font-size:1.45rem; margin:0; }
  .tabs { display:flex; gap:8px; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:3px; }
  .tabs button { flex:none; border:1px solid var(--line); border-radius:999px; background:transparent; padding:.45em 1.1em; color:var(--muted); font-weight:600; transition:color .15s, background .15s, border-color .15s; }
  .tabs button:hover { color:var(--text); border-color:rgba(255,255,255,.3); }
  .tabs button[aria-pressed="true"] { background:var(--text); border-color:var(--text); color:var(--bg); }
  .grid { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:30px 22px; }
  .sf-card { all:unset; box-sizing:border-box; display:block; width:100%; cursor:pointer; border-radius:var(--radius); }
  .sf-card:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
  .thumb { position:relative; display:block; aspect-ratio:16/9; border-radius:var(--radius); overflow:hidden; background:var(--thumb); }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
  .thumb .ph { position:absolute; inset:0; display:grid; place-items:center; font-size:2.2rem; font-weight:800; color:rgba(255,255,255,.14); }
  .thumb .play { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.35); opacity:0; transition:opacity .2s; }
  .thumb .play span { width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--accent) 92%, transparent); color:#fff; transform:scale(.85); transition:transform .2s; }
  .thumb .meter { position:absolute; left:10px; right:10px; bottom:10px; }
  .seen { position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:#fff; }
  .seen svg { width:16px; height:16px; }
  .sf-card:hover .thumb img, .sf-card:focus-visible .thumb img { transform:scale(1.05); }
  .sf-card:hover .play, .sf-card:focus-visible .play { opacity:1; }
  .sf-card:hover .play span, .sf-card:focus-visible .play span { transform:none; }
  .sf-card .title { display:block; margin:12px 0 2px; font-weight:600; }
  .sf-card .title .n { color:var(--muted); margin-right:.35em; }
  .sf-card .sub { display:block; color:var(--muted); font-size:.85rem; }
  .sf-card .ov { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; color:var(--muted); font-size:.88rem; margin-top:6px; }

  @media (max-width:760px) {
    .backdrop { height:64vh; }
    .backdrop::after { background:linear-gradient(0deg, var(--bg) 4%, color-mix(in srgb, var(--bg) 15%, transparent) 60%, color-mix(in srgb, var(--bg) 35%, transparent) 100%); }
    .hero { min-height:0; padding-top:40vh; }
    #app.bare .hero { padding-top:72px; }
    .poster { display:none; }
    .actions .btn { flex:1; justify-content:center; }
    .party-row input { flex-basis:100%; }
    .party-row .btn { flex:1; justify-content:center; }
  }

  /* Player */
  .player { position:fixed; inset:0; z-index:20; background:#000; color:#fff; overflow:hidden; }
  .player video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .player video::cue { background:rgba(0,0,0,.55); font-size:clamp(18px, 2.5vw, 34px); line-height:1.35; }
  .player video::-webkit-media-text-track-container { transition:transform .35s; }
  .player:not(.idle) video::-webkit-media-text-track-container { transform:translateY(-96px); }
  .player > .spinner { position:absolute; left:50%; top:50%; margin:-22px 0 0 -22px; pointer-events:none; display:none; }
  .player.loading > .spinner { display:block; }
  .osd { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; transition:opacity .35s; }
  .player.idle { cursor:none; }
  .player.idle .osd { opacity:0; }
  .player.idle .osd > * { pointer-events:none; }
  .osd-top { display:flex; align-items:center; gap:12px; padding:max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 60px max(20px, env(safe-area-inset-left)); background:linear-gradient(rgba(0,0,0,.75), transparent); }
  .np { flex:1; min-width:0; }
  .np strong { display:block; font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np span { display:block; color:rgba(255,255,255,.7); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ends { color:rgba(255,255,255,.75); font-size:.9rem; white-space:nowrap; }
  .osd-bottom { padding:60px max(20px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background:linear-gradient(transparent, rgba(0,0,0,.85)); }
  .timeline { position:relative; }
  .tip { position:absolute; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; white-space:nowrap; padding:2px 8px; border-radius:6px; background:rgba(20,20,26,.92); font-size:.8rem; font-variant-numeric:tabular-nums; pointer-events:none; }
  .tip-img { margin:4px -4px 0; border-radius:4px; background:#000 no-repeat; }
  .marks { position:absolute; left:0; right:0; top:7px; height:4px; pointer-events:none; }
  .marks i { position:absolute; top:0; width:3px; height:4px; margin-left:-1px; background:rgba(0,0,0,.75); }
  .row { display:flex; align-items:center; gap:2px; margin-top:6px; }
  .row .grow { flex:1; }
  .time { margin-left:10px; font-size:.9rem; font-variant-numeric:tabular-nums; color:rgba(255,255,255,.85); white-space:nowrap; }
  .ctl { text-decoration:none; width:44px; height:44px; border:0; border-radius:50%; display:grid; place-items:center; background:transparent; color:#fff; transition:background .15s; }
  .ctl:hover { background:rgba(255,255,255,.14); }
  .ctl svg { width:26px; height:26px; }
  .volume { display:flex; align-items:center; }
  .volume .range { width:0; opacity:0; transition:width .2s, opacity .2s, margin .2s; }
  .volume:hover .range, .volume:focus-within .range { width:90px; opacity:1; margin:0 8px; }
  .range { -webkit-appearance:none; appearance:none; display:block; width:100%; height:18px; margin:0; background:transparent; cursor:pointer; --p:0%; --b:0%; }
  .range:focus-visible { outline:none; }
  .range::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,.45) var(--p) var(--b), rgba(255,255,255,.2) var(--b)); }
  .range::-moz-range-track { height:4px; border-radius:2px; background:linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,.45) var(--p) var(--b), rgba(255,255,255,.2) var(--b)); }
  .range::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border:0; border-radius:50%; background:#fff; transform:scale(0); transition:transform .15s; }
  .range::-moz-range-thumb { width:14px; height:14px; border:0; border-radius:50%; background:#fff; transform:scale(0); transition:transform .15s; }
  .range:hover::-webkit-slider-thumb, .range:focus-visible::-webkit-slider-thumb, .range:active::-webkit-slider-thumb { transform:none; }
  .range:hover::-moz-range-thumb, .range:focus-visible::-moz-range-thumb, .range:active::-moz-range-thumb { transform:none; }
  .bigplay { position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; border:0; border-radius:50%; display:none; place-items:center; background:color-mix(in srgb, var(--accent) 92%, transparent); color:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5); transition:transform .15s; }
  .bigplay:hover { transform:scale(1.06); }
  .bigplay svg { width:46px; height:46px; }
  .player.paused:not(.loading) .bigplay { display:grid; }
  .upnext { position:absolute; right:max(20px, env(safe-area-inset-right)); bottom:124px; display:none; align-items:center; gap:12px; max-width:min(380px, calc(100vw - 40px)); padding:10px 14px 10px 18px; border:1px solid var(--line); border-radius:12px; background:var(--overlay); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); color:#fff; font-weight:600; text-align:left; transition:bottom .35s; animation:rise .3s ease both; }
  .player.show-next .upnext { display:flex; }
  .skip { position:absolute; right:max(20px, env(safe-area-inset-right)); bottom:124px; padding:12px 22px; border:1px solid var(--line); border-radius:12px; background:var(--overlay); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); color:#fff; font-weight:600; transition:bottom .35s, background .15s; animation:rise .3s ease both; }
  .skip:hover { background:var(--accent); }
  .player.idle .skip { bottom:28px; }
  .player.idle .upnext { bottom:28px; }
  .upnext .t { min-width:0; }
  .upnext small { display:block; color:var(--muted); font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
  .upnext #upNextTitle { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .menu { position:absolute; right:max(20px, env(safe-area-inset-right)); bottom:100px; width:min(300px, calc(100vw - 32px)); display:grid; gap:14px; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--overlay); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 20px 60px rgba(0,0,0,.6); animation:rise .2s ease both; }
  .menu label { display:grid; gap:6px; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .menu select { padding:.6em .8em; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:.95rem; font-weight:400; text-transform:none; letter-spacing:0; }
  @media (hover:none) { .volume .range { display:none; } }
  @media (max-width:560px) { .wide-only { display:none !important; } .time { font-size:.8rem; margin-left:4px; } .osd-top { padding-bottom:40px; } }

  .sf-toast { position:fixed; left:50%; bottom:32px; z-index:30; transform:translateX(-50%); max-width:calc(100vw - 32px); padding:12px 18px; border:1px solid rgba(255,118,118,.4); border-radius:10px; background:#2a1b1f; color:#ffd6d6; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:rise .25s ease both; }
  body.noscroll .sf-toast { bottom:112px; }
  @media (prefers-reduced-motion:reduce) { *:not(.spinner), *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
{{theme}}
</head>
<body>
<div id="status" class="status" role="status"><div id="statusSpin" class="spinner"></div><p id="statusText">Chargement…</p></div>

<section id="login" class="login-wrap" hidden>
  <form id="loginForm" class="login-card">
    <div class="lock"><span data-icon="lock"></span></div>
    <h1>Contenu protégé</h1>
    <p class="muted">Saisissez le mot de passe reçu avec ce lien.</p>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="reveal" class="reveal" type="button" aria-label="Afficher le mot de passe" aria-pressed="false"><span data-icon="eye"></span></button>
    </div>
    <p id="loginError" class="error" role="alert"></p>
    <button id="loginBtn" class="btn primary" type="submit">Accéder</button>
  </form>
</section>

<div id="app" hidden>
  <div class="backdrop" aria-hidden="true"><img id="backdrop" alt="" hidden></div>
  <main class="sf-page">
    <section class="hero">
      <img id="poster" class="poster" alt="" hidden>
      <div class="info">
        <p id="eyebrow" class="eyebrow" hidden></p>
        <img id="logo" class="logo" alt="" hidden>
        <h1 id="title"></h1>
        <div id="meta" class="meta"></div>
        <p id="tagline" class="tagline" hidden></p>
        <p id="overview" class="overview"></p>
        <div id="actions" class="actions" hidden>
          <button id="playMain" class="btn primary" type="button"><span data-icon="play"></span><span id="playLabel">Lire</span></button>
          <button id="restart" class="btn" type="button" hidden><span data-icon="replay"></span>Depuis le début</button>
          <button id="partyBtn" class="btn" type="button"><span data-icon="group"></span>Regarder ensemble</button>
        </div>
        <div id="resume" class="resume" hidden><span class="meter"><i id="resumeBar"></i></span><span id="resumeText"></span></div>
        <div id="partyBar" class="party" hidden>
          <p><strong>Séance à plusieurs</strong> · <span id="partyCount"></span><br><span class="muted">Envoyez ce lien : ceux qui l'ouvrent, avec le mot de passe, regardent en même temps que vous. Lecture, pause et position sont partagées, chacun garde son volume.</span></p>
          <div class="party-row"><input id="partyLink" readonly aria-label="Lien d'invitation"><button id="partyCopy" class="btn" type="button">Copier</button><button id="partyLeave" class="btn" type="button">Quitter</button></div>
        </div>
      </div>
    </section>
    <section id="seasons" hidden>
      <div class="episodes-head"><h2>Épisodes</h2><div id="tabs" class="tabs"></div></div>
      <ul id="episodes" class="grid"></ul>
    </section>
  </main>
</div>

<div id="player" class="player paused" hidden>

    var entry = queue[index];
    opening = entry.item.Id;
    api('items/' + entry.item.Id + '/playback?sid=' + sid).then(function (r) {
      opening = null;
      if (!r.ok) { if (r.status === 401) location.reload(); else toast('Lecture impossible.'); return; }
      return r.json().then(function (info) {
        var prevSub = play && play.info.Subtitles.filter(function (s) { return String(s.Index) === $('subs').value; })[0];
        var keepSub = prevSub && info.Subtitles.filter(function (s) { return s.Language === prevSub.Language; })[0];
        if (play) saveProgress();
        play = { index: index, id: entry.item.Id, info: info, mode: null, offset: 0, forceTranscode: false, pending: null };
        $('npTitle').textContent = entry.title;
        $('npSub').textContent = entry.sub;
        fillSelect($('audio'), info.Audio.map(function (a) { return { value: a.Index, label: a.Title }; }), info.DefaultAudioIndex);
        fillSelect($('subs'), [{ value: '', label: 'Aucun' }].concat(info.Subtitles.map(function (s) { return { value: s.Index, label: s.Title }; })), keepSub ? keepSub.Index : '');
        show('audioBox', info.Audio.length > 1);
        show('subsBox', info.Subtitles.length > 0);
        closeMenu();
        var next = queue[index + 1];
        show('next', !!next);
        $('upNextTitle').textContent = next ? next.title : '';
        player.classList.remove('show-next');
        seek.max = Math.floor(info.DurationSeconds) || 0;
        var marks = $('marks'), d = info.DurationSeconds;
        marks.textContent = '';
        info.Chapters.forEach(function (c) {
          if (!d || c.Start < 1 || c.Start > d - 1) return;
          var m = el('i');
          m.style.left = c.Start / d * 100 + '%';
          marks.appendChild(m);
        });
        show('pip', !!document.pictureInPictureEnabled);
        $('download').href = base + 'items/' + entry.item.Id + '/stream';
        show('download', info.Download);
        player.hidden = false;
        document.body.classList.add('noscroll');
        poke();
        var start = follow && party ? partyPosition() : fromStart ? 0 : resumeAt(entry.item.Id);
        if (party && !follow) partySend({ ItemId: entry.item.Id, Position: start, Paused: false });
        load_(start);
      });
    }, function () { opening = null; toast('Serveur injoignable.'); });
  }

  function closePlayer() {
    saveProgress();
    if (fsElement()) exitFs();
    clearTimeout(seekTimer);
    play = null;
    video.pause();
    video.removeAttribute('src'); // ends the request, which stops the server-side transcode
    video.load();
    Array.prototype.slice.call(video.querySelectorAll('track')).forEach(function (t) { t.remove(); });
    closeMenu();
    player.hidden = true;
    document.body.classList.remove('noscroll');
    refresh();
  }

  function position() {
    if (!play) return 0;
    if (play.pending != null) return play.pending;
    return play.mode === 'transcode' ? play.offset + video.currentTime : video.currentTime;
  }

  function load_(t) {
    var info = play.info;
    var audio = Number($('audio').value);
    play.pending = null;
    switching = true;
    player.classList.add('loading');
    if (directOk()) {
      play.mode = 'direct';
      play.offset = 0;
      video.src = base + 'items/' + play.id + '/stream';
      video.currentTime = t;
    } else {
      play.mode = 'transcode';
      play.offset = t;
      var q = 'sid=' + sid + '&t=' + Math.floor(t) + (info.Audio.length ? '&audio=' + audio : '') + ($('quality').value ? '&height=' + $('quality').value : '') +
        '&vcopy=' + (canVideo(info.VideoCodec) ? 'true' : 'false') +
        '&acopy=' + (canAudio(audioCodec(info, audio)) ? 'true' : 'false');
      video.src = base + 'items/' + play.id + '/transcode?' + q;
    }
    setSubtitles();
    if (!party || !party.state.Paused) video.play().catch(noop); // autoplay blocked: the big play button stays
    ui();
  }

  function setSubtitles() {
    Array.prototype.slice.call(video.querySelectorAll('track')).forEach(function (t) { t.remove(); });
    var index = $('subs').value;
    if (index === '') return;
    var track = el('track');
    track.kind = 'subtitles';
    track.default = true;
    track.src = base + 'items/' + play.id + '/subtitles/' + index + '?t=' + (play.mode === 'transcode' ? Math.floor(play.offset) : 0);
    video.appendChild(track);
    track.addEventListener('load', function () { track.track.mode = 'showing'; });
    track.track.mode = 'showing';
  }

  // Seeks inside what is already buffered when possible; otherwise a transcode restarts at the new position.
  // quiet: the séance asked for it, so it is not sent back.
  function seekTo(t, quiet) {
    if (!play) return;
    var d = play.info.DurationSeconds;
    t = Math.max(0, d ? Math.min(t, d - 1) : t);
    if (party && !quiet) partySend({ Position: t });
    if (play.mode === 'direct') { video.currentTime = t; return; }
    var rel = t - play.offset, b = video.buffered;
    for (var i = 0; i < b.length; i++) {
      if (rel >= b.start(i) && rel <= b.end(i)) { clearTimeout(seekTimer); play.pending = null; video.currentTime = rel; return; }
    }
    play.pending = t;
    ui();
    clearTimeout(seekTimer);
    seekTimer = setTimeout(function () { if (play && play.pending != null) load_(play.pending); }, 400); // coalesces repeated key presses
  }

  function saveProgress() {
    if (!play || !play.info.DurationSeconds) return;
    var d = play.info.DurationSeconds, t = position();
    if (t < 1) return;
    remember('pos:' + play.id, { t: t >= d * 0.95 ? d : Math.floor(t), d: d, w: Date.now() });
  }

  function pct(input, p, b) {
    input.style.setProperty('--p', p * 100 + '%');
    input.style.setProperty('--b', (b == null ? p : b) * 100 + '%');
  }

  function ui() {
    if (!play) return;
    var d = play.info.DurationSeconds || 0, pos = position(), buffered = 0, b = video.buffered;
    for (var i = 0; i < b.length; i++) if (b.start(i) <= video.currentTime + 1) buffered = Math.max(buffered, b.end(i));
    if (play.mode === 'transcode') buffered += play.offset;
    if (!dragging) {
      seek.value = pos;
      $('time').textContent = clock(pos) + ' / ' + clock(d);
      pct(seek, d ? pos / d : 0, d ? Math.max(pos, buffered) / d : 0);
    }
    $('ends').textContent = d ? 'Fin à ' + new Date(Date.now() + (d - pos) * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
    player.classList.toggle('show-next', !!queue[play.index + 1] && d > 0 && d - pos < 30);
    var seg = play.info.Segments.filter(function (s) { return pos >= s.Start && pos < s.End - 2; })[0];
    show('skip', !!seg && $('menu').hidden);
    if (seg) { $('skip').textContent = seg.Type === 'Recap' ? 'Passer le récap' : 'Passer l\'intro'; play.skipTo = seg.End; }
  }

  function chapterAt(t) {
    var name = '';
    play.info.Chapters.forEach(function (c) { if (c.Start <= t && c.Name) name = c.Name; });
    return name;
  }

  function togglePlay() { if (video.paused) video.play().catch(noop); else video.pause(); }

  function poke() {
    player.classList.remove('idle');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!video.paused && $('menu').hidden && !dragging) player.classList.add('idle'); }, 3000);
  }

  function closeMenu() { show('menu', false); $('menuBtn').setAttribute('aria-expanded', 'false'); }

  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function exitFs() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* already left */ } }
  function fullscreen() {
    if (fsElement()) { exitFs(); return; }
    var request = player.requestFullscreen || player.webkitRequestFullscreen;
    if (request) {
      Promise.resolve(request.call(player)).then(function () {
        if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
      }).catch(noop);
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen(); // iPhone: only the video element itself can go full screen
    }
  }
  function fsChanged() {
    var on = !!fsElement();
    setIcon('fs', on ? 'fullscreenExit' : 'fullscreen');
    $('fs').setAttribute('aria-label', on ? 'Quitter le plein écran' : 'Plein écran');
  }
  document.addEventListener('fullscreenchange', fsChanged);
  document.addEventListener('webkitfullscreenchange', fsChanged);

  function playState() {
    var paused = video.paused;
    player.classList.toggle('paused', paused);
    setIcon('playPause', paused ? 'play' : 'pause');
    $('playPause').setAttribute('aria-label', paused ? 'Lecture' : 'Pause');
    poke();
  }

  video.addEventListener('play', function () { playState(); partyShare(); });
  video.addEventListener('pause', function () { playState(); saveProgress(); partyShare(); });
  video.addEventListener('waiting', function () { player.classList.add('loading'); });
  video.addEventListener('playing', function () { player.classList.remove('loading'); });
  video.addEventListener('canplay', function () { player.classList.remove('loading'); });
  video.addEventListener('loadedmetadata', function () { switching = false; }); // always fires, unlike canplay on a paused video
  video.addEventListener('progress', ui);
  video.addEventListener('timeupdate', function () {
    ui();
    if (Date.now() - lastSave > 5000) { lastSave = Date.now(); saveProgress(); }
  });
  video.addEventListener('ended', function () {
    if (!play) return;
    saveProgress();
    if (queue[play.index + 1]) openPlayer(play.index + 1, false);
  });
  video.addEventListener('error', function () {
    switching = false;
    if (!play || !video.getAttribute('src')) return;
    if (play.mode === 'direct' && !play.forceTranscode) {
      play.forceTranscode = true; // the browser could not decode the original file after all
      load_(video.currentTime || 0);
      return;
    }
    player.classList.remove('loading');
    if (play.mode !== 'transcode') { toast('Lecture impossible.'); return; }
    // A media element never exposes the HTTP status: ask whether the 429 "too many viewers" is the cause.
    api('items/' + play.id + '/playback?sid=' + sid).then(function (r) { return r.ok ? r.json() : null; }).catch(noop).then(function (info) {
      toast(info && info.StreamsBusy ? 'Trop de lectures en cours sur ce lien. Réessayez plus tard.' : 'Lecture impossible.');
    });
  });

  var v = recall('volume');
  video.volume = typeof v === 'number' ? v : 1;
  video.muted = recall('muted') === true;
  function volumeState() {
    var level = video.muted ? 0 : video.volume;
    vol.value = level;
    pct(vol, level);
    setIcon('mute', level ? 'volume' : 'volumeOff');
    $('mute').setAttribute('aria-label', video.muted ? 'Rétablir le son' : 'Couper le son');
  }
  video.addEventListener('volumechange', function () { volumeState(); remember('volume', video.volume); remember('muted', video.muted); });
  volumeState();
  vol.addEventListener('input', function () { video.volume = Number(vol.value); video.muted = video.volume === 0; });
  $('mute').addEventListener('click', function () { video.muted = !video.muted; if (!video.muted && !video.volume) video.volume = 0.5; });

  seek.addEventListener('input', function () {
    dragging = true;
    var d = play ? play.info.DurationSeconds : 0, t = Number(seek.value);
    $('time').textContent = clock(t) + ' / ' + clock(d);
    pct(seek, d ? t / d : 0, null);
    if (play) tipAt(t); // touch: the preview follows the finger while dragging
  });
  seek.addEventListener('change', function () {
    dragging = false;
    if (lastPointer !== 'mouse') show('tip', false);
    seekTo(Number(seek.value));
  });
  seek.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse' || !play) return;
    var r = seek.getBoundingClientRect();
    tipAt(Math.min(Math.max(e.clientX - r.left, 0), r.width) / r.width * play.info.DurationSeconds);
  });

  // Time and chapter above the timeline, with the matching thumbnail when Jellyfin generated trickplay tiles.
  function tipAt(t) {
    var d = play.info.DurationSeconds, w = seek.getBoundingClientRect().width, tp = play.info.Trickplay, chapter = chapterAt(t), half = 40;
    $('tipText').textContent = clock(t) + (chapter ? ' · ' + chapter : '');
    show('tipImg', !!tp);
    if (tp) {
      var n = Math.max(0, Math.min(tp.ThumbnailCount - 1, Math.floor(t * 1000 / tp.Interval))), per = tp.TileWidth * tp.TileHeight, k = n % per, box = $('tipImg').style;
      box.width = tp.Width + 'px';
      box.height = tp.Height + 'px';
      box.backgroundImage = 'url("' + base + 'items/' + play.id + '/trickplay/' + tp.Width + '/' + Math.floor(n / per) + '.jpg")';
      box.backgroundPosition = -(k % tp.TileWidth) * tp.Width + 'px ' + -Math.floor(k / tp.TileWidth) * tp.Height + 'px';
      half = tp.Width / 2 + 8;
    }
    $('tip').style.left = Math.min(Math.max(d ? t / d * w : 0, half), Math.max(half, w - half)) + 'px'; // stays on screen at both ends
    show('tip', true);
  }
  seek.addEventListener('pointerleave', function () { show('tip', false); });

  $('playPause').addEventListener('click', togglePlay);
  $('bigPlay').addEventListener('click', togglePlay);
  $('back10').addEventListener('click', function () { seekTo(position() - 10); });
  $('fwd10').addEventListener('click', function () { seekTo(position() + 10); });
  $('next').addEventListener('click', function () { openPlayer(play.index + 1, false); });
  $('skip').addEventListener('click', function () { if (play && play.skipTo) seekTo(play.skipTo); });
  $('upNext').addEventListener('click', function () { openPlayer(play.index + 1, false); });
  $('close').addEventListener('click', closePlayer);
  $('fs').addEventListener('click', fullscreen);
  $('pip').addEventListener('click', function () {
    (document.pictureInPictureElement ? document.exitPictureInPicture() : video.requestPictureInPicture()).catch(noop);
  });
  $('menuBtn').addEventListener('click', function () {
    var open = $('menu').hidden;
    show('menu', open);
    this.setAttribute('aria-expanded', String(open));
    if (open) $('menu').querySelector('label:not([hidden]) select').focus();
  });
  $('audio').addEventListener('change', function () { load_(position()); });
  $('subs').addEventListener('change', setSubtitles);
  $('quality').value = recall('quality') || '';
  $('quality').addEventListener('change', function () { remember('quality', $('quality').value); load_(position()); });

  // Mouse: a click on the picture plays or pauses. Touch: a tap shows or hides the controls.
  player.addEventListener('pointerdown', function (e) { lastPointer = e.pointerType; if (e.target !== $('osd')) poke(); });
  player.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') poke(); });
  $('osd').addEventListener('click', function (e) {
    if (e.target !== this) return;
    if (!$('menu').hidden) { closeMenu(); return; }
    if (lastPointer === 'mouse') { togglePlay(); poke(); }
    else if (player.classList.contains('idle') || video.paused) poke();
    else player.classList.add('idle');
  });
  $('osd').addEventListener('dblclick', function (e) { if (e.target === this && lastPointer === 'mouse') fullscreen(); });

  document.addEventListener('keydown', function (e) {
    if (player.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t.tagName === 'SELECT' || t === vol) { if (e.key === 'Escape') { closeMenu(); $('menuBtn').focus(); } return; }
    if (t.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    switch (e.key) {
      case ' ': case 'k': case 'K': togglePlay(); break;
      case 'ArrowLeft': case 'j': case 'J': seekTo(position() - 10); break;
      case 'ArrowRight': case 'l': case 'L': seekTo(position() + 10); break;
      case 'ArrowUp': video.muted = false; video.volume = Math.min(1, video.volume + 0.05); break;
      case 'ArrowDown': video.volume = Math.max(0, video.volume - 0.05); break;
      case 'f': case 'F': fullscreen(); break;
      case 'm': case 'M': video.muted = !video.muted; break;
      case 'Escape': if (!$('menu').hidden) closeMenu(); else if (!fsElement()) closePlayer(); break;
      default: return;
    }
    e.preventDefault();
    poke();
  });

  window.addEventListener('pagehide', saveProgress);

  // ---- Séance: watching together ----
  // The server holds the video, whether it is paused and where; every viewer follows it with a long poll.
  // Only play, pause, seek and the video are shared: volume, audio, subtitles and quality stay local.

  function inviteId() { return (/^#party=([0-9a-f]{32})$/.exec(location.hash) || [])[1]; }
  function partyUrl() { return location.origin + location.pathname + location.search + '#party=' + party.id; }
  function partyPosition() { var s = party.state; return s.Position + (s.Paused ? 0 : (Date.now() - party.at) / 1000); }

  function partyStart(id, state) {
    party = { id: id, version: -1, state: { ItemId: null, Paused: true, Position: 0 }, at: Date.now(), inflight: 0, fixed: 0, abort: new AbortController() };
    history.replaceState(null, '', '#party=' + id);
    $('partyLink').value = partyUrl();
    $('partyCount').textContent = '';
    show('partyBar', true);
    show('partyBtn', false);
    show('partyPill', true);
    if (state) partyApply(state);
    partyPoll();
  }

  function partyLeave() {
    if (!party) return;
    party.abort.abort();
    party = null;
    history.replaceState(null, '', location.pathname + location.search);
    show('partyBar', false);
    show('partyPill', false);
    show('partyBtn', queue.length > 0);
  }

  function partyPoll() {
    var p = party;
    api('party/' + p.id + '?sid=' + sid + '&v=' + p.version, { signal: p.abort.signal }).then(function (r) {
      if (party !== p) return;
      if (r.status === 401) { location.reload(); return; }
      if (r.status === 404) { partyLeave(); toast('Cette séance est terminée.'); return; }
      if (!r.ok) throw new Error(String(r.status));
      return r.json().then(function (s) { partyApply(s); partyPoll(); });
    }).catch(function () { setTimeout(function () { if (party === p) partyPoll(); }, 3000); });
  }

  // Tells the séance about the viewer's own change, and assumes it until the server answers.
  function partySend(change) {
    var p = party;
    Object.assign(p.state, change);
    p.at = Date.now();
    p.inflight++;
    api('party/' + p.id + '?sid=' + sid, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(change) })
      .then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
      .then(function (s) {
        if (party !== p) return;
        p.inflight--;
        if (s) partyApply(s); else toast('La séance ne répond pas.');
      });
  }

  // The viewer played or paused (our buttons, keyboard, picture-in-picture or the system's controls).
  function partyShare() {
    if (party && play && !switching && play.id === party.state.ItemId && video.paused !== party.state.Paused) {
      partySend({ Paused: video.paused, Position: position() });
    }
  }

  function partyApply(s) {
    if (s.Version < party.version) return; // an answer overtaken by a newer one
    var fresh = s.Version > party.version;
    party.version = s.Version;
    $('partyCount').textContent = plural(s.Viewers, 'spectateur');
    $('partyPillN').textContent = s.Viewers;
    $('partyPill').title = plural(s.Viewers, 'spectateur') + ' dans la séance';
    if (party.inflight) return; // the viewer's own newer change is on its way
    party.state = s;
    party.at = Date.now();
    var index = -1;
    queue.forEach(function (e, i) { if (e.item.Id === s.ItemId) index = i; });
    if (index < 0) return;
    // A closed player reopens only when someone changes something, not on every poll.
    if (!play || play.id !== s.ItemId) { if (fresh && opening !== s.ItemId) openPlayer(index, false, true); return; }
    partySync(fresh);
  }

  // Brings the player to the séance. A small drift is left alone; a transcode restart costs seconds, so it gets more slack.
  function partySync(force) {
    if (!party || !play || play.id !== party.state.ItemId || party.inflight || switching || play.pending != null) return;
    var want = partyPosition();
    if (Math.abs(position() - want) > (play.mode === 'direct' ? 2 : 4) && (force || Date.now() - party.fixed > 8000)) {
      party.fixed = Date.now();
      seekTo(want, true);
    }
    if (party.state.Paused !== video.paused) { if (party.state.Paused) video.pause(); else video.play().catch(noop); }
  }
  setInterval(function () { partySync(false); }, 2000);

  $('partyBtn').addEventListener('click', function () {
    api('party?sid=' + sid, { method: 'POST' }).then(function (r) {
      if (r.status === 429) { toast('Trop de séances ouvertes sur ce lien.'); return; }
      if (!r.ok) { toast('Impossible d\'ouvrir une séance.'); return; }
      return r.json().then(function (s) { partyStart(s.Id, s); $('partyLink').select(); });
    }, function () { toast('Serveur injoignable.'); });
  });
  $('partyCopy').addEventListener('click', function () {
    var b = this;
    $('partyLink').select();
    (navigator.clipboard ? navigator.clipboard.writeText(partyUrl()) : Promise.reject()).then(function () {
      b.textContent = 'Copié';
      setTimeout(function () { b.textContent = 'Copier'; }, 2000);
    }, noop); // no clipboard: the link stays selected for a manual copy
  });
  $('partyLeave').addEventListener('click', partyLeave);
  // An invitation pasted into a tab already on the page.
  window.addEventListener('hashchange', function () {
    var id = inviteId();
    if (id && data && (!party || party.id !== id)) { partyLeave(); partyStart(id); }
  });

  fetchContent();
})();
</script>
</body>
</html>
